<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark saver</title>
  <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    </head>
<body>
  <div class="app-container">
    <h1>Bookmark Saver</h1>
    <div class="input-container">
      <input type="text" id="bookmark-name" placeholder="Bookmark Name" />
      <input type="url" id="bookmark-url" placeholder="Bookmark URL" />
      <button id="add-bookmark">Add Bookmark</button>
    </div>
    <p id="form-message" class="form-message" role="alert"></p>
    <input type="search" id="bookmark-search" class="bookmark-search" placeholder="Search your bookmarks..." aria-label="Search bookmarks" />
    <ul id="bookmark-list"></ul>
    <p id="empty-note" class="empty-note">No bookmarks to show yet.</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
