<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Generator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    </head>
<body>
  <div class="container">
      <h1>Color Palette Generator</h1>

      <p class="hint">Tip: press the <kbd>Space</kbd> bar to generate. Click the lock to keep a color.</p>

      <button id="generate-btn">
        <i class="fas fa-sync-alt"></i>
        Generate Palette
      </button>

      <div class="palette-container">
        <!-- COLOR BOX 1 -->
        <div class="color-box">
          <div class="color" style="background-color: #fde8e2"></div>
          <div class="color-info">
            <span class="hex-value">#FDE8E2</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            <i class="fas fa-lock-open lock-btn" title="Lock this color"></i>
          </div>
        </div>
        <!-- COLOR BOX 2 -->
        <div class="color-box">
          <div class="color" style="background-color: #fbc5b4"></div>
          <div class="color-info">
            <span class="hex-value">#FBC5B4</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            <i class="fas fa-lock-open lock-btn" title="Lock this color"></i>
          </div>
        </div>
        <!-- COLOR BOX 3 -->
        <div class="color-box">
          <div class="color" style="background-color: #f5a086"></div>
          <div class="color-info">
            <span class="hex-value">#F5A086</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            <i class="fas fa-lock-open lock-btn" title="Lock this color"></i>
          </div>
        </div>
        <!-- COLOR BOX 4 -->
        <div class="color-box">
          <div class="color" style="background-color: #f17a55"></div>
          <div class="color-info">
            <span class="hex-value">#F17A55</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            <i class="fas fa-lock-open lock-btn" title="Lock this color"></i>
          </div>
        </div>
        <!-- COLOR BOX 5 -->
        <div class="color-box">
          <div class="color" style="background-color: #ee5e31"></div>
          <div class="color-info">
            <span class="hex-value">#EE5E31</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            <i class="fas fa-lock-open lock-btn" title="Lock this color"></i>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  
</body>
</html>
