<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curreny Converter App</title>
    <link rel="stylesheet" href="style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    </head>
  <body>
    <div class="container">
      <h1>Currency Converter</h1>

      <form id="converter-form">
        <div class="form-group">
          <label for="amount">Amount</label>
          <input type="number" id="amount" placeholder="Enter amount" required />
        </div>

        <div class="form-group">
          <label for="from-currency">From</label>
          <select id="from-currency">
            <!-- Currency options will be inserted from our api -->
          </select>
        </div>

        <button type="button" id="swap-btn" class="swap-btn" title="Swap currencies" aria-label="Swap currencies">&#8645; Swap</button>

        <div class="form-group">
          <label for="to-currency">To</label>
          <select id="to-currency">
            <!-- Currency options will be inserted from our api -->
          </select>
        </div>

        <button type="submit">Convert</button>
      </form>

      <div id="result"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
