<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
          <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    </head>
<body>
  <div class="container">
    <h1>Expense Tracker</h1>

    <div class="balance-container">
      <h2>Your Balance</h2>
      <h1 id="balance">$0.00</h1>

      <div class="summary">
        <div class="income">
          <h3>Income</h3>
          <p id="income-amount">$0.00</p>
        </div>

        <div class="expenses">
          <h3>Expenses</h3>
          <p id="expense-amount">$0.00</p>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="transaction-container">
        <h2>Transactions</h2>
        <ul id="transaction-list">
          <!-- TRANSACTIONS WILL BE INSERTED HERE -->
        </ul>
      </div>

       <div class="form-container">
        <h2>Add Transaction</h2>
        
        <form id="transaction-form">
          <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="Enter description..." required />
          </div>

           <div class="form-group">
             <label for="amount">Amount</label>
             <input type="number" id="amount" placeholder="Enter amount..." min="0.01" step="0.01" required />
             <small>Enter a positive number</small>
           </div>

           <div class="form-group">
             <label>Type</label>
             <div class="type-toggle">
               <label class="type-option"><input type="radio" name="type" value="income" checked /><span>Income</span></label>
               <label class="type-option"><input type="radio" name="type" value="expense" /><span>Expense</span></label>
             </div>
           </div>
           <button type="submit">Add Transaction</button>
        </form>
       </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
