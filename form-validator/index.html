<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validator</title>
  <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    </head>
<body>

  <div class="container">
    <form id="registration-form">
       <h1>Register</h1>

       <!-- username -->
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username" />
          <small></small>
        </div>

        <!-- email -->
         <div class="form-group">
          <label for="email">Email</label>
           <input type="email" id="email" placeholder="Enter email" />
           <small></small>
         </div>

         <!-- password -->
           <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap"><input type="password" id="password" placeholder="Enter password" /><button type="button" class="toggle-pw" data-target="password" aria-label="Show password">Show</button></div>
            <small></small>
           </div>

           <!-- confirm password -->
            <div class="form-group">
              <label for="confirmPassword">Confirm Password</label>
              <div class="password-wrap"><input type="password" id="confirmPassword" placeholder="Confirm Password" /><button type="button" class="toggle-pw" data-target="confirmPassword" aria-label="Show password">Show</button></div>
              <small></small>
            </div>

            <!-- submit btn -->
             <button type="submit">Register</button>
    </form>
  </div>

<script src="script.js"></script>
</body>
</html>
